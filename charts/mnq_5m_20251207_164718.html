        // Calculate interval based on timeframe (in seconds)
        function getTimeframeSeconds(tf) {
            const match = tf.match(/(\d+)([mhd])/);
            if (!match) return 60;
            const value = parseInt(match[1]);
            const unit = match[2];
            if (unit === 'm') return value * 60;
            if (unit === 'h') return value * 3600;
            if (unit === 'd') return value * 86400;
            return 60;
        }

        function updateStatus(message) {

        // Initialize chart after library loads
        function initChart() {
            try {
                // Check if library loaded
                if (typeof LightweightCharts === 'undefined') {
                    showError('TradingView library failed to load');
                    return;
                }
                
                if (!chartData || chartData.length === 0) {
                    showError('No chart data available');
                    return;
                }
                
                // Get chart container

                if (!chartContainer) {
                    showError('Chart container not found');
                    return;
                }
                
                // Create chart
                chart = LightweightCharts.createChart(chartContainer, {
                    layout: {
                        background: { color: '#1a1a1a' },
                        textColor: '#d1d5db',

                    grid: {

                    crosshair: {

                    },
                    rightPriceScale: {
                        borderColor: '#2a2a2a',
                    },

                        timeVisible: true,
                        secondsVisible: false,
                    },
                    width: chartContainer.clientWidth,
                    height: 600,
                });
                
                // Create candlestick series
                if (typeof chart.addCandlestickSeries !== 'function') {
                    showError('addCandlestickSeries not available');
                    console.error('Available methods:', Object.getOwnPropertyNames(chart));
                    return;

                candlestickSeries = chart.addCandlestickSeries({

                        bottom: 0,
                    },
                });
                
                // Set up volume price scale

                        top: 0.8,
                        bottom: 0,
                    },
                });
                
                // Prepare initial data (only if not in backtest mode)
                if (!backtestActive) {
                    const candlestickData = chartData.map(bar => ({
                        time: bar.time,
                        open: parseFloat(bar.open),
                        high: parseFloat(bar.high),
                        low: parseFloat(bar.low),
                        close: parseFloat(bar.close),
                    }));
                    
                    const volumeData = chartData.map(bar => ({
                        time: bar.time,
                        value: parseInt(bar.volume) || 0,
                        color: parseFloat(bar.close) >= parseFloat(bar.open) ? '#26a69a80' : '#ef535080',
                    }));
                    
                    // Set data
                    candlestickSeries.setData(candlestickData);
                    volumeSeries.setData(volumeData);
                    
                    // Fit content
                    chart.timeScale().fitContent();
                }
                
                updateStatus('Chart ready - ' + chartData.length + ' bars loaded');
                
                // Auto-start if modes are enabled

                showError('Chart error: ' + error.message);
                console.error('Full error:', error);
            }

        // Real-time update function
        async function updateRealtime() {
            if (!serverPort) {
                updateStatus('Real-time server not available');
                return;
            }
            
            try {
                const response = await fetch(`http://127.0.0.1:${serverPort}/api/chart/quote`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                
                if (data.latest_bar) {
                    const bar = data.latest_bar;
                    const lastBar = chartData[chartData.length - 1];
                    
                    // Check if this is a new bar or update to current bar
                    if (bar.time === lastBar.time) {
                        // Update current bar
                        lastBar.high = Math.max(lastBar.high, bar.close);
                        lastBar.low = Math.min(lastBar.low, bar.close);
                        lastBar.close = bar.close;
                        lastBar.volume = bar.volume;
                        
                        // Update chart
                        candlestickSeries.update({
                            time: bar.time,
                            open: lastBar.open,
                            high: lastBar.high,
                            low: lastBar.low,
                            close: lastBar.close,
                        });
                        
                        volumeSeries.update({
                            time: bar.time,
                            value: bar.volume,
                            color: bar.close >= lastBar.open ? '#26a69a80' : '#ef535080',
                        });
                    } else if (bar.time > lastBar.time) {
                        // New bar
                        chartData.push(bar);
                        candlestickSeries.update({
                            time: bar.time,
                            open: bar.open,
                            high: bar.high,
                            low: bar.low,
                            close: bar.close,
                        });
                        
                        volumeSeries.update({
                            time: bar.time,
                            value: bar.volume,
                            color: bar.close >= bar.open ? '#26a69a80' : '#ef535080',
                        });
                    }
                    
                    updateStatus(`Real-time: ${data.quote.last || data.quote.bid || 'N/A'} | ${new Date().toLocaleTimeString()}`);
                }
            } catch (error) {
                console.error('Real-time update error:', error);
                updateStatus('Real-time update failed: ' + error.message);
            }
        }
        
        // Toggle real-time updates
        function toggleRealtime() {
            const btn = document.getElementById('realtimeBtn');
            if (!btn) return;
            
            if (realtimeActive) {
                // Stop
                if (realtimeInterval) {
                    clearInterval(realtimeInterval);
                    realtimeInterval = null;
                }
                realtimeActive = false;
                btn.textContent = 'Start Real-Time';
                btn.classList.remove('active');
                updateStatus('Real-time updates stopped');
            } else {
                // Start
                if (!serverPort) {
                    showError('Real-time server not available. Start chart with --realtime flag.');
                    return;
                }
                realtimeActive = true;
                btn.textContent = 'Stop Real-Time';
                btn.classList.add('active');
                updateRealtime(); // Immediate update
                realtimeInterval = setInterval(updateRealtime, 1000); // Update every second
                updateStatus('Real-time updates started');
            }
        }

                candlestickSeries.update({
                    time: bar.time,
                    open: bar.open,
                    high: bar.high,
                    low: bar.low,
                    close: bar.close,
                });
                
                volumeSeries.update({
                    time: bar.time,
                    value: bar.volume,
                    color: bar.close >= bar.open ? '#26a69a80' : '#ef535080',
                });
            } else {
                // Add new bar
                candlestickSeries.update({
                    time: bar.time,
                    open: bar.open,
                    high: bar.high,
                    low: bar.low,
                    close: bar.close,
                });
                
                volumeSeries.update({
                    time: bar.time,
                    value: bar.volume,
                    color: bar.close >= bar.open ? '#26a69a80' : '#ef535080',
                });
            }
            
            const date = new Date(bar.time * 1000);
            updateStatus(`Backtest: ${backtestIndex + 1}/${chartData.length} | ${date.toLocaleString()}`);
            
            backtestIndex++;
        }
        
        // Toggle backtesting
        function toggleBacktest() {
            const btn = document.getElementById('backtestBtn');
            if (!btn) return;
            
            if (backtestActive) {
                // Stop
                if (backtestInterval) {
                    clearInterval(backtestInterval);
                    backtestInterval = null;
                }
                backtestActive = false;
                btn.textContent = 'Start Backtest';
                btn.classList.remove('active');
                updateStatus('Backtest stopped');
            } else {
                // Start
                backtestActive = true;
                backtestIndex = 0;
                btn.textContent = 'Stop Backtest';
                btn.classList.add('active');
                
                // Clear existing data and start fresh
                candlestickSeries.setData([]);
                volumeSeries.setData([]);
                
                playBacktestBar(); // Play first bar immediately
                backtestInterval = setInterval(playBacktestBar, backtestIntervalMs);
                updateStatus('Backtest started');
            }
        }
        
        // Wait for DOM and library
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(initChart, 200);
            });
        } else {
            setTimeout(initChart, 200);
        }
        
        window.addEventListener('load', function() {
            if (!chart) {
                setTimeout(initChart, 200);
            }
        });
        
        // Refresh chart
        function refreshChart() {
            updateStatus('Refresh not available. Re-run chart command to update.');
        }
        
        // Export data to CSV
        function exportData() {
            try {
                const csv = [
                    ['Time', 'Open', 'High', 'Low', 'Close', 'Volume'].join(','),
                    ...chartData.map(bar => {
                        const date = new Date(bar.time * 1000);
                        return [
                            date.toISOString(),
                            bar.open,
                            bar.high,
                            bar.low,
                            bar.close,
                            bar.volume
                        ].join(',');
                    })
                ].join('\n');
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mnq_5m_20251207_164718.csv';
                a.click();
                window.URL.revokeObjectURL(url);
                updateStatus('CSV exported');
            } catch (error) {
                showError('Export error: ' + error.message);
            }
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (chart && chartContainer) {
                chart.applyOptions({ width: chartContainer.clientWidth });
            }
        });
    </script>
</body>
