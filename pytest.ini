[pytest]
asyncio_mode = auto
# Repo root must be on sys.path so `import core`, `import strategies` work from any CWD.
pythonpath = .
# Fast default: one smoke module. Legacy suite under tests/ has many stale imports;
# run explicitly when repairing tests:
#   pytest --override-ini="testpaths=tests"
testpaths =
    tests/test_smoke_imports.py
    tests/test_order_executor_event_bus.py
    tests/test_logging_setup_log_path.py
    tests/test_research_runner.py
    tests/test_vwap_zscore_reversion_smoke.py
    tests/test_pattern_conditional.py
    tests/test_body_reversion_smoke.py
    tests/test_morning_range_reversion_smoke.py
    tests/test_hourly_anchor_retrace_smoke.py
    tests/test_strategy_replay_intrabar.py
    tests/test_strategy_litmus_smoke.py
    tests/test_chart_databento_loader.py
    tests/test_chart_ws_snapshot_fingerprint.py
    tests/test_print_weekly_income.py
    tests/test_backtest_perf_helpers.py
    tests/test_backtest_engine_capital.py
    tests/test_drift_monitor_smoke.py
    tests/test_income_brain_smoke.py
    tests/test_income_brain_bot_wiring.py
    tests/test_bracket_partial_tp_design.py
filterwarnings =
    ignore::DeprecationWarning
markers =
    bench: performance microbenchmarks (scripts/run_bench.sh or pytest tests/bench -m bench)
    slow: slow tests
