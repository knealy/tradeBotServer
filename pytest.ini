[pytest]
asyncio_mode = auto
# Repo root must be on sys.path so `import core`, `import strategies` work from any CWD.
pythonpath = .
# Fast default: one smoke module. Legacy suite under tests/ has many stale imports;
# run explicitly when repairing tests:
#   pytest --override-ini="testpaths=tests"
testpaths =
    tests/test_smoke_imports.py
    tests/test_order_executor_event_bus.py
    tests/test_logging_setup_log_path.py
    tests/test_research_runner.py
    tests/test_vwap_zscore_reversion_smoke.py
    tests/test_pattern_conditional.py
    tests/test_body_reversion_smoke.py
filterwarnings =
    ignore::DeprecationWarning
markers =
    bench: performance microbenchmarks (scripts/run_bench.sh or pytest tests/bench -m bench)
    slow: slow tests
