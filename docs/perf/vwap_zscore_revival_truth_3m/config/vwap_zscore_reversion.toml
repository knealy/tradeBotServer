# VWAP Z-score reversion (PROMOTED 2026-06-08 → MGC-only production tier).
#
# 2026-06-08 (revival, stagnant-tier truth audit on the corrected engine):
# Promoted from Disabled tier after the post-engine-fix walk-forward
# audit revealed the strategy is materially profitable on MGC across
# every window — and that the MNQ leg is the only thing dragging the
# global verdict negative.  Same pattern as the R24 overnight_range
# MNQ-leg discovery.  Per-symbol 9m truth on the corrected engine
# (docs/perf/_audit_stagnant/vwap_zscore_mgc_{3m,6m,9m}/,
# --no-cache-decisions end-to-end):
#
#   Window    n    ret %   DD %    RF    WR %
#     3m     61  +67.40   14.59   2.45   49.2     ← strongest, most recent
#     6m    119  +80.51   33.34   1.42   45.4
#     9m    181  +55.98   38.98   0.99   40.9
#
# Cross-window robustness: RF *improves* 9m → 3m, DD shrinks, WR rises.
# The strategy is performing BETTER in the most recent regime — opposite
# of stagnant — so the alpha is current.  No tune-up needed for revival;
# the pre-fix R0 baseline numbers on MGC remain the committed config.
#
# MNQ leg (DISABLED): on the corrected engine MNQ ran 9m at -82 % / DD
# 89 % / RF -0.89 / WR 26.7 % (n=176).  Fade signal on MNQ does not work
# on the current dataset — likely because MNQ intraday is more
# trend-persistent than MGC (VWAP fades during NY morning drives are
# the dominant MNQ failure mode in the chart audit).  Re-enable only
# with explicit tune-up.
#
# Live wiring is OFF by default.  Backtest:
#   .venv/bin/python core/backtest_executor.py --strategy=vwap_zscore_reversion \
#     --symbol=MGC --timeframe=1m --csv=historical_data/price/MGC_1m_complete.csv \
#     --start=2025-12-24 --end=2026-04-30 --format=json --include-trades --replay
#
# All knobs honor env overrides (e.g. VWAP_ZSCORE_REVERSION_SIGNAL_Z_ENTRY=2.5).

[meta]
# 2026-06-08: enabled for MGC ONLY after stagnant-tier audit revival.
# MNQ stanza retained (dormant) at the bottom for fast re-enablement
# after a future tune.
enabled = true
symbols = ["MGC"]

[risk]
position_size      = 1
max_positions      = 1
max_daily_trades   = 6
risk_per_trade_pct = 0.5
respect_dll        = true
respect_mll        = true
max_dll_usage_pct  = 0.75

[signal]
timeframe          = "1m"
# Bars pulled from history each tick (must be > one full RTH session ≈ 390 1m bars).
lookback_bars      = 600
# Rolling stdev window for the (close - VWAP) residual.
window_bars        = 30
# Skip the first N RTH bars so VWAP / stdev are stable.
min_session_bars   = 15
# |Z| must exceed this to trigger.
z_entry            = 2.0
# Hard cap to avoid blow-out trades during regime shifts (skip > z_max).
z_max              = 5.0
# ATR(period) on the same timeframe used for stop distance (entry +/- stop_atr * ATR).
atr_period         = 14
stop_atr_multiplier = 1.5
# Stop-entry offset beyond current close, in ticks (small confirmation move).
entry_offset_ticks = 1.0
# RTH window (US/Eastern). 09:35–15:30 by default avoids open-noise + cash-close drift.
rth_only           = true
rth_start          = "09:35"
rth_end            = "15:30"
session_timezone   = "US/Eastern"

[symbols.MNQ]
[symbols.MES]
[symbols.MGC]
