# Overnight Range Breakout strategy configuration.
# See _schema.toml for documentation of every field.
# Edit values here without restarting unrelated strategies; the executor
# polls mtime and reloads on next loop tick when --reload is enabled.
# Master GUI chart OR lines (when the executor is a separate process): see
# process_states.metadata.or_ranges + strategy_states.settings.or_ranges in README / HANDOFF.

[meta]
enabled = true
# Live consec-loss / equity-curve breaker bridge — Round 21 commits the
# 19:00→10:00 + gap + 2x5-day breaker config; live deployment needs this
# bridge ON so the breaker reacts to live fills the same way it reacts to
# replayed trades in the walk-forward. Env STRATEGY_LIVE_BREAKER=0 is the
# kill-switch.
live_breaker_enabled = true
# 2026-05-31 round-13 — dropped MES from active rotation (consistent with the
# parallel finding for ``morning_range_reversion``).  See CHANGELOG for the
# 13-round optimization sweep details.  MES per-symbol stanzas are kept
# (dormant) at the bottom of this file for fast re-enablement.
symbols = ["MNQ", "MGC"]

[timing]
# Default 18:00–9:29 ET. Sweep `docs/perf/parameter_sweeps/overnight_timing_mnq` (2026-04-11..2026-05-01, MNQ, ATR 1.5/2.5):
#   start 19:00 → +PnL vs 17:00/18:00; end 7:00 → higher WR (~61%) but slightly lower PnL than 9:29; open 9:25/9:29/9:30 tied.
#
# 2026-06-01 R18-R19 + R20-R21 sweeps (270d / 9 folds, MNQ+MGC):
#   prior committed (19:00→9:29)         ret=+678.49% dd=11.73% rf=10.85  n=190
#   19:00→10:00 + gap only (r19g)        ret=+681.12% dd=13.72% rf=17.57  n=131
#   19:00→10:00 + gap + brk_2x5 (r21c)   ret=+654.05% dd= 9.78% rf=21.73  n=107  ← NOW COMMITTED
#   19:00→10:00 + gap + brk_3x5 (r20h)   ret=+658.41% dd= 8.47% rf=18.81  n=112
# Cross-window validation (270d / 9f, 180d / 6f, 90d / 3f):
#   r21c 3m: ret +234.49% dd 26.20% rf 7.79 | 6m ret +545% dd 9.76% rf 18.11 | 9m above
#   baseline 3m: ret +274.92% dd 28.86% rf 4.40 | 6m ret +588% dd 18.67% rf 9.41
#   Trade-off: -4% return on 9m for -17% DD + 100% RF gain. Same direction on 6m and 3m.
# The breaker (2 losses → 5-session cooldown) plus the gap filter trims
# the high-vol cluster sessions that historically pushed the equity curve
# into 18%+ DD. WR up from 33% to 38% — fewer setups, much higher quality.
overnight_start  = "19:00"
overnight_end    = "10:00"
market_open      = "10:00"
zone_anchor      = "9:29"
session_timezone = "US/Eastern"
# CSV replay only: minutes after ``market_open`` (ET) in which ``analyze()`` may place brackets.
# **0 = no cap** (full session after open; still at most one attempt per symbol/session via
# ``_replay_sessions_signaled``). Live uses breakout monitor + full day — unchanged by this.
replay_order_window_minutes = 0
# CSV / walk-forward replay: US/Eastern clock to market-flat + cancel pendings (prop day cap).
replay_force_flat_et = "16:00"

[risk]
position_size      = 1
max_positions      = 2
max_daily_trades   = 3

risk_per_trade_pct = 0.5
respect_dll        = true
respect_mll        = true
max_dll_usage_pct  = 0.75

[signal]
atr_period          = 14
atr_timeframe       = "5m"
# Round-13: root stop/TP are the MGC defaults inherited via [symbols.MGC.*].
# MNQ overrides both (tighter stop, wider TP) in its own [symbols.MNQ.*] block.
# Geometric R:R = 1 : 2.5 (root) and 1 : 8 (MNQ override after stop=0.5/tp=4).
stop_atr_multiplier = 1.0
tp_atr_multiplier   = 2.5

# ── Cross-session consec-loss circuit breaker ─────────────────────────────────
# Round 21 sweep (270d / 9 folds, MNQ+MGC; committed = 19:00→10:00 + gap on):
#   no breaker:          ret=+681.12% dd=13.72% rf=17.57 wr=37.40% n=131
#   2-loss/5-day:        ret=+654.05% dd= 9.78% rf=21.73 wr=38.32% n=107  ← committed
#   3-loss/5-day:        ret=+658.41% dd= 8.47% rf=18.81 wr=38.39% n=112
# Cross-window (3m / 6m / 9m) confirmed the same Pareto direction: -4% return,
# -17% DD, +100% RF on 9m; -7% return, -48% DD, +92% RF on 6m.
# Reads ``StrategyReplayEngine.trades`` (backtest) or ``_live_trade_history``
# (live, fed by EventType.TRADE_CLOSED).  See core/consec_loss_breaker.py.
max_consecutive_losses            = 2
loss_streak_cooldown_sessions     = 5
# Optional magnitude filter ($ threshold).  0 = count-only (recommended for this
# strategy — the gap filter already screens out the deep-loss regimes).
rolling_pnl_loss_threshold_dollars = 0


# BONGO §1A — dual native stop-entry when qty ≥ 2 (see docs/BONGO.md).
partial_tp_enabled  = false
partial_tp_scalp_r  = 1.0
use_range_pct_sltp  = false
stop_range_pct      = 50.0
tp_range_pct        = 100.0

[position_management]
breakeven_enabled          = false
# NOTE (round-13): explicit isolation sweep (`r2b_isolation`) proved BE has
# ZERO effect in the overnight_range replay path because
# ``_simulate_place_oco_bracket`` never registers a breakeven watch (the live
# bot's ``register_generic_breakeven_watch`` is only intercepted for the
# ``place_bracket_order`` path used by morning_range).
# 2026-06-03 R23 follow-up: ``_place_oco_stop_entry_bracket`` now registers
# step-trail watches via ``register_generic_breakeven_watch`` directly (the
# strategy-side single-keyword commit superseded the deferred engine work).
# The legacy ``breakeven_*`` pair below remains the live-monitor knob path
# (``_monitor_breakeven_stops`` reads it); the replay step-trail is configured
# via ``position_management.trail_steps_r`` (R-multiple based, see comment).
breakeven_profit_points    = 8.0
# ── Step-trail (R23 — 2026-06-03) ─────────────────────────────────────────────
# List of (trigger_R, lock_offset_R) stages in **R-multiples** of the per-trade
# initial risk |entry − stop|. Each row registers a separate watch via the
# engine's existing BE-watch mechanism (synthetic keys ``{order_id}_trail{N}``).
# Multi-stage entries (e.g. ``[[2.0, 1.0], [4.0, 2.5]]``) ratchet the SL forward
# in steps; the engine guards against backwards regression so order doesn't
# matter for correctness. Empty list → trail disabled (R22 behaviour).
#
# R-multiples (not raw points) so the SAME row works across MNQ (R≈25pts at
# stop_atr=0.5) and MGC (R≈7pts) — see ``_register_trail_watches``.
#
# R24 sweep (270d / 9 folds / MNQ+MGC, 14 trials) ranked candidates by RF×ret:
#   no trail          ret=+139.46% dd=10.62% rf= 8.52 wr=34.7%  ← R22 baseline
#   [[1.0, 0.0]]      ret= +95.93% dd=19.59% rf= 3.04 wr=27.9%  BE@1R kills runners
#   [[2.0, 0.0]]      ret=+103.45% dd=19.59% rf= 3.28 wr=29.5%  pure BE still hurts
#   [[2.0, 1.0]]      ret=+142.62% dd= 9.66% rf= 8.71 wr=39.7%  ← R23 WINNER
#   [[3.0, 1.0]]      ret=+136.25% dd= 9.66% rf= 8.32 wr=38.4%
#   [[2.0, 1.0],[4.0, 2.5]]    ret=+138.34% dd=9.52% rf=8.45 wr=39.7%  (2-stage)
#   [[1.0,0.0],[2.0,1.0],[3.0,2.0]] ret=+83% dd=11.9% rf=4.51 (3-stage classic — hurts)
# R25 fine-tune (14 trials) confirmed [[2.0, 1.0]] is the local optimum;
# tightening (1.75/0.75) or loosening (2.5/1.5) both regressed by 1–10% RF.
# R26 cross-window check (3m / 6m / 9m, 9 trials each) found pairing the
# trail with looser MNQ TPs (5/6/8/10 ATR) consistently HURT MNQ — winners
# already cluster at the existing 4R TP and a wider target just trades a
# certain 4R win for a smaller-MFE-eventually-stopped outcome.
#
# Per-symbol breakdown of the R23 winner vs R22 baseline:
#   MNQ ret  +30.23 → +32.12  (+6.3%); winners hold longer protected by the
#                              R23 step (median win bars 10, p75 37, max 67)
#   MGC ret +109.22 → +110.50 (+1.2%); marginal — MGC winners (median 1 bar)
#                              usually hit TP=2R before the 2R trigger fires
# Cross-window net: 3m ret +63 vs +54 (+16%), 6m flat (-0.2%), 9m +2.3%. WR
# consistently +5–10pp across all windows. DD smaller on 3m/9m, slightly
# wider on 6m. **Risk-adjusted (RF) better on the windows that matter for
# the continuation thesis** — see docs/STRATEGY_ARSENAL.md "R23" section.
trail_steps_r              = [[2.0, 1.0]]
# Round-22 post-fix re-tune (2026-06-03 PM, after the BACKTEST_FAST_LOOP `_BarRow`
# EOD-flat bypass fix that corrected the round-14 partial-fill artefacts): the
# previously-committed `range_break_offset = 1.0` from round-13 was tuned on
# the buggy baseline. Clean 12-trial filter sweep on the corrected baseline
# (docs/perf/_opt_runs/overnight_range_postfix/r2) put `= 1.5` ahead of
# `= 1.0` by +19% return / -10% DD / +19% RF as a single-knob change. The
# stacked winner (gap 1.20 + rbo 1.5, see filters.gap_max_pct comment) was
# also tested for cross-window stability — 3m / 6m / 9m all Pareto-better
# than the committed baseline. `= 1.5` is the new sweet spot.
range_break_offset         = 1.5

use_dynamic_atr_for_orders = true

[breakout_monitor]
enabled              = true
proximity_pct        = 15.0
min_proximity_points = 15.0
interval_seconds     = 10.0

[alerts]
# Discord when this many consecutive sessions end with zero completed trades (0 = off).
discord_after_zero_trade_sessions = 0

[filters]
# --- Trade frequency note ---
# At most ~1 bracket attempt / symbol / session near open. ``skip_weekdays`` removes listed
# weekdays (Mon=0 … Sun=6). With range+gap+volatility all true, narrow bands still skip many sessions.
#
# **Range / gap / ATR** use **percent of overnight midpoint** ``(H+L)/2`` — same bands on MNQ,
# MES, MGC. Values below match the prior MNQ point globals at reference price 21_000
# (e.g. 15 pts → 15/21000×100). Legacy ``*_pts`` keys in ``[filters]`` still load and convert
# the same way.
#
# Round-14 (2026-06-01) — ATR-percent volatility filter ON.
# Sweep R16/R17 (15 trials × 3 horizons): ``volatility=true`` with
# ``atr_min_pct=0.08`` / ``atr_max_pct=0.60`` dominates the committed
# Round-13 baseline on every horizon:
#   3m: ret +265%→+275%   dd 30.18%→28.86%   rf 4.24→4.40
#   6m: ret +568%→+588%   dd 20.85%→18.67%   rf 9.09→9.41
#   9m: ret +656%→+678%   dd 11.53%→11.73%   rf 10.49→10.85
# The floor (0.08% of midpoint) gates out dead-range overnights where the
# breakout has no fuel; the ceiling (0.60%) gates out the 2026-Q1 vol-cluster
# choppy sessions whose 1-σ overnight range was prone to multi-side whipsaw
# (those were the bulk of MGC's prior Feb 24-Mar 17 drawdown contribution).
# Wider-floor (0.12) variant pushed 6m DD to 11.75% but cost some
# 9m return — kept tighter floor to preserve trade count on quiet expiries.
#
# Round-13: ``filters.range_size`` stayed OFF because the band-on sweep
# (r5j, r11e/f) added no return at the current band defaults; the per-symbol
# weekday skips below were the bigger lever.  Magnitude/ATR percent filters
# remain available for future regime work.
range_size        = false
# Round-22 post-fix re-tune (2026-06-03 PM): the round-21 commit of
# `gap_max_pct = 0.80` was tuned on the buggy baseline (BACKTEST_FAST_LOOP
# `_BarRow` EOD-flat bypass — see CHANGELOG 2026-06-03 PM). With the engine
# corrected, the partial-fill artefacts that made the tight gap look
# protective are gone, and the true optimum is materially wider. Round-22
# 12-trial filter sweep (docs/perf/_opt_runs/overnight_range_postfix/r2 + r3):
#   gap_max_pct = 0.80 (R21 commit) ret +78%  dd 17%  rf 2.60  wr 30.8%
#   gap_max_pct = 1.00 (r2c)        ret +117% dd 12%  rf 4.42  wr 31.3%
#   gap_max_pct = 1.20 (r2d) ←      ret +140% dd 10%  rf 8.70  wr 34.2%   ← NOW COMMITTED
#   gap_max_pct = 1.50 (r3b)        ret +116% dd 10%  rf 6.05  wr 31.5%
#   gap_max_pct = 2.00 (r3c)        ret +94%  dd 18%  rf 3.38  wr 29.5%
#   gap_off       (r2a)             ret +129% dd 17%  rf 4.71  wr 30.1%
# Stacked winner (gap 1.20 + rbo 1.5) ret +139% dd 10.6% rf 8.52 (9m). Cross-window:
#   3m: ret +54% dd 11.75% rf 3.52 (vs baseline ret +12% dd 26% rf 0.40)
#   6m: ret +80% dd 14.69% rf 4.89 (vs baseline ret +22% dd 24% rf 0.72)
#   9m: ret +139% dd 10.62% rf 8.52 (vs baseline ret +78% dd 17% rf 2.60)
# **Same Pareto direction every horizon** — not overfit to the 9m window.
gap               = true
volatility        = true
dll_proximity     = false
range_min_pct     = 0.07142857142857142
range_max_pct     = 2.857142857142857
gap_max_pct       = 1.20
atr_min_pct       = 0.08
atr_max_pct = 0.5
dll_threshold_pct = 0.75

# Round-13: root-level weekday skip is OFF.  Per-symbol weekday skips below
# (MNQ skips Mon+Fri, MGC skips Wed) collapse drawdown without sacrificing
# return — see CHANGELOG for the per-fold MGC analysis that motivated MGC
# Wednesday skip (fold 4: 1 win in 13 trades = -$1166 in the choppy
# Feb 24-Mar 17 regime).
skip_weekdays     = []

# ─────────────────────────────────────────────────────────────────────────────
# MNQ — wider stop coverage, asymmetric breakout R:R (1 : 8) and weekday gating
# ─────────────────────────────────────────────────────────────────────────────
# Round-13 per-symbol sweep (sweep r6g vs r5d vs r9b):
#   • ``stop_atr_multiplier = 0.5`` (vs root 1.0) → MNQ pulled from +$0 to
#     +$228/9m (sweep r5d, RF 5.25; sweep r6g, RF 6.81).  Tighter stop is the
#     dominant MNQ lever — false breakouts that retrace 0.5R are now cut as
#     small losers instead of compounding to a full 1R stop.
#   • ``tp_atr_multiplier = 4.0`` (vs root 2.5) → +449%→+677% on 9m at the
#     same DD.  TP=4 sits above the typical 2-ATR mean-reversion node where
#     range-break continuation trades top out.
#   • ``filters.skip_weekdays = [0, 4]`` (Mon+Fri) cut DD 43→38% and
#     boosted RF 6.81→10.95 (r9b vs r6g).  MNQ Mondays are choppy and
#     Fridays often see weekend-de-risking reversal — both regimes hostile
#     to breakout continuation.  Wednesday and Thursday remain MNQ's best.

[symbols.MNQ.signal]
stop_atr_multiplier = 0.5
tp_atr_multiplier   = 4.0

[symbols.MNQ.filters]
skip_weekdays = [0, 4]

# ─────────────────────────────────────────────────────────────────────────────
# MGC — tighter stop + tighter TP + skip Wednesdays
# ─────────────────────────────────────────────────────────────────────────────
# Round-13 per-symbol sweep (sweep r11b, r11j, r12d, r12e, r13a):
#   • ``stop_atr_multiplier = 0.5`` (vs root 1.0) → 9m DD 38%→23%.  MGC's
#     biggest historical losses were the cluster of Feb 24-Mar 17 2026 false
#     breakouts (1 win in 13 trades).  Tighter stop cuts the per-trade loss
#     magnitude there from ~1R to ~0.5R.
#   • ``tp_atr_multiplier = 2.0`` (vs root 2.5) → 6m DD 78%→31%.  MGC's
#     range-break continuations rarely run past 2 ATR (high WR but low
#     payoff multiple) so taking profit earlier captures more of them and
#     reduces giveback during chop.
#   • ``filters.skip_weekdays = [2]`` (Wed) cut MGC trades 123→101 and
#     boosted MGC PnL +279→+333 on 9m (sweep r12d).  Wednesday MGC overnight
#     ranges are statistically the noisiest in the dataset.
[symbols.MGC.risk]
position_size = 1

[symbols.MGC.signal]
stop_atr_multiplier = 0.5
tp_atr_multiplier   = 2.0

[symbols.MGC.filters]
skip_weekdays = [2]

# ─────────────────────────────────────────────────────────────────────────────
# MES — DORMANT (dropped from rotation in round-13, see [meta].symbols).
# Settings preserved for fast A/B re-enable via:
#   OVERNIGHT_RANGE_META_SYMBOLS=MNQ,MES,MGC ./scripts/run_overnight.sh 1
# ─────────────────────────────────────────────────────────────────────────────
[symbols.MES.signal]
stop_atr_multiplier = 0.5
tp_atr_multiplier   = 2.0

[symbols.MES.filters]
skip_weekdays = [0, 4]
