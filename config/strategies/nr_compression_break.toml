# NR7 compression-break strategy (Phase-2 #2.3 — Toby Crabel daily-TF).
#
# Alpha thesis (per docs/STRATEGY_ARSENAL.md):
#   A daily bar whose true range is the smallest of the trailing 7 daily
#   bars signals intraday volatility compression.  The first directional
#   break of the following session has a measurable continuation edge
#   when paired with a continuation cue (yesterday's close vs open).
#
# Direction: BREAKOUT-CONTINUE (one direction per day per symbol).
# Window  : Entry stops live during 09:30 - 14:30 ET; force-flat at 15:55 ET.
# Symbols : MNQ + MES + MGC (cross-instrument, daily-TF setup).
# Stop    : 0.8 × ATR(14) on 5m bars (intraday ATR scales the compression
#           stop so a low-vol day doesn't get a giant point stop).
# TP      : 2.0R (2× the stop distance).
# Risk    : 1 contract per fill; consec-loss breaker tripped after 3 losses
#           with a 3-day cooldown.  Portfolio daily breaker (Phase-1 infra)
#           is consulted via `core.portfolio_daily_breaker.replay_evaluate`.
#
# Run backtest (offline CSV):
#   ENABLE_SIGNALR=false PYTHONUNBUFFERED=1 \
#     .venv/bin/python core/backtest_executor.py --strategy=nr_compression_break \
#       --symbol=MNQ --timeframe=5m \
#       --csv=historical_data/price/MNQ_5m_databento.csv \
#       --start=2025-09-01 --end=2026-05-01 --replay --format=json --include-trades \
#       > /tmp/nr_compression_break_MNQ.json 2> /tmp/nr_compression_break_MNQ.log
#
# Executor ``should_trade`` window: US/Eastern.
start_time       = "00:00"
end_time         = "23:59"
no_trade_start   = ""
no_trade_end     = ""

[meta]
# Disabled by default — switch on once the 9m walk-forward acceptance
# criteria (RF ≥ 10, DD ≤ 50 %, ≥ 25 fills) clear.
enabled = false
live_breaker_enabled = true
symbols = ["MNQ", "MES", "MGC"]

[risk]
position_size      = 1
max_positions      = 1
max_daily_trades   = 1
risk_per_trade_pct = 0.5
respect_dll        = true
respect_mll        = true
max_dll_usage_pct  = 0.75

[signal]
# All keys below also accessible at the root level via env overrides
# NR_COMPRESSION_BREAK_SIGNAL_<KEY>.
timeframe                  = "5m"
# Need ~14 trading days of 5m bars to detect NR7 reliably.  At 78 RTH 5m bars
# per day, 2000 = ~25 trading days of headroom.
lookback_bars              = 2000

# Compression detection — Crabel's classic NR7.  Increase to NR21 for a
# rarer, higher-quality signal at the cost of trade count.
nr_lookback                = 7

# ATR(14) on 5m bars for intraday stop scaling.
atr_period                 = 14
stop_atr_multiplier        = 0.8
tp_r_multiple              = 2.0
entry_offset_ticks         = 1

# Force-flat after this many 5m bars (78 = full RTH session).  Combined
# with the explicit flat_et cutoff, ensures no NR7 trade runs into the
# next session.
max_hold_bars              = 78

# Entry window — only place stop orders during these ET hours.
entry_window_et_start      = "09:30"
entry_window_et_end        = "14:30"
flat_et                    = "15:55"

# RTH window for daily-bar aggregation (only RTH 5m bars contribute to
# the daily OHLC used for NR7 detection).
rth_start_et               = "09:30"
rth_end_et                 = "16:00"

# Directional bias: pick LONG/SHORT from yesterday's RTH body direction.
# Setting use_continuation_bias=false would require symmetric OCO entry
# orders (NOT implemented in v1).
use_continuation_bias      = true
min_body_pct               = 0.10

# Consecutive-loss breaker — same shape as body_reversion / overnight_range.
max_consecutive_losses     = 3
loss_streak_cooldown_sessions = 3
loss_streak_magnitude_dollars = 0.0

# Per-symbol overrides — placeholder; tune after first sweep.
[symbols.MNQ]
[symbols.MES]
[symbols.MGC]
