# =====================================================================
# Strategy config schema — copy this file when adding a new strategy and
# rename it to <strategy_name>.toml. Comments document the precedence and
# the env-var fallback for every key.
#
# Precedence (resolved by core.strategy_config.StrategyConfig):
#     CLI override  >  environment variable  >  this TOML  >  class default
#
# The env-var name for a dotted TOML key is:
#     <STRATEGY_NAME_UPPER>_<DOTTED_KEY_UPPER_WITH_UNDERSCORES>
# e.g.  risk.position_size  ->  OVERNIGHT_RANGE_RISK_POSITION_SIZE
# Most legacy env vars (OVERNIGHT_START_TIME, ATR_PERIOD, etc.) keep
# working as-is via the unprefixed last-segment fallback in the loader.
# =====================================================================

[meta]
enabled = true                       # master on/off; obeyed by strategy_executor
symbols = ["MNQ", "MES", "MGC"]      # default symbol set; CLI --symbols overrides

[timing]
overnight_start = "18:00"            # legacy env: OVERNIGHT_START_TIME
overnight_end   = "18:15"            # legacy env: OVERNIGHT_END_TIME
market_open     = "18:15"            # legacy env: MARKET_OPEN_TIME
zone_anchor     = "18:15"            # legacy env: ZONE_ANCHOR_TIME
session_timezone = "US/Eastern"      # legacy env: STRATEGY_TIMEZONE
replay_order_window_minutes = 0    # CSV replay: 0 = no minute cap after market_open (still never before open); >0 = cap minutes after open (legacy 8)
replay_force_flat_et = "16:00"     # US/Eastern: class replay market-flats + cancels pendings from first bar at/after this clock; ``off`` disables
# OHLC bad-tick wick clip (replay + LWC) is ``core.backtest.ohlcv.DEFAULT_MAX_BODY_WICK_PT`` (not a TOML key).

[risk]
position_size       = 1              # default contracts per fill
max_positions       = 2              # cap on open positions per symbol
max_daily_trades    = 4
risk_per_trade_pct  = 0.5
respect_dll         = true
respect_mll         = true
max_dll_usage_pct   = 0.75

[signal]
atr_period           = 14            # legacy env: ATR_PERIOD
atr_timeframe        = "15m"         # legacy env: ATR_TIMEFRAME
stop_atr_multiplier  = 1.25          # legacy env: STOP_ATR_MULTIPLIER
tp_atr_multiplier    = 1.5           # legacy env: TP_ATR_MULTIPLIER
use_range_pct_sltp   = false         # legacy env: USE_RANGE_PCT_SLTP
stop_range_pct       = 50.0          # legacy env: STOP_RANGE_PCT
tp_range_pct         = 100.0         # legacy env: TP_RANGE_PCT

[position_management]
breakeven_enabled         = true     # legacy env: BREAKEVEN_ENABLED
breakeven_profit_points   = 15.0     # legacy env: BREAKEVEN_PROFIT_POINTS
range_break_offset        = 0.25     # legacy env: RANGE_BREAK_OFFSET
use_dynamic_atr_for_orders = true    # legacy env: USE_DYNAMIC_ATR_FOR_ORDERS

[breakout_monitor]
enabled                  = true      # legacy env: BREAKOUT_MONITOR_ENABLED
proximity_pct            = 10.0      # legacy env: BREAKOUT_PROXIMITY_PERCENT
min_proximity_points     = 5.0       # legacy env: BREAKOUT_MIN_PROXIMITY_POINTS
interval_seconds         = 15.0      # legacy env: BREAKOUT_MONITOR_INTERVAL_SECONDS

[filters]
range_size       = false             # legacy env: OVERNIGHT_FILTER_RANGE_SIZE
gap              = false             # legacy env: OVERNIGHT_FILTER_GAP
volatility       = false             # legacy env: OVERNIGHT_FILTER_VOLATILITY
dll_proximity    = false             # legacy env: OVERNIGHT_FILTER_DLL_PROXIMITY
# Overnight range / gap / ATR filters: **percent of (H+L)/2** (``overnight_range`` only). Legacy
# ``*_pts`` keys still load: pts / 21000 × 100 (MNQ reference). Prefer explicit ``*_pct``.
range_min_pct    = 0.2380952380952381   # ≈ 50 pts @ 21k ref (schema default; tune in strategy TOML)
range_max_pct    = 2.380952380952381    # ≈ 500 pts @ 21k
gap_max_pct      = 0.9523809523809523   # ≈ 200 pts @ 21k
atr_min_pct      = 0.09523809523809523  # ≈ 20 pts @ 21k
atr_max_pct      = 0.9523809523809523   # ≈ 200 pts @ 21k
dll_threshold_pct = 0.75             # legacy env: OVERNIGHT_DLL_THRESHOLD_PERCENT (ratio 0–1)
skip_weekdays    = []                # e.g. [0, 4] = skip Mon/Fri (Python weekday); live + replay

# =====================================================================
# Per-symbol overrides — anything in [symbols.<SYM>] beats the global value
# above for that symbol only. Use for symbol-specific position sizing,
# different ATR bands, etc. Looked up via cfg.symbol_override().
# =====================================================================

[symbols.MNQ]
# Per-symbol overrides live under nested tables (``cfg.symbol_override`` walks the tree).
# Example — ``overnight_range`` bracket qty + stop ATR mult:
# [symbols.MNQ.risk]
# position_size = 2
# [symbols.MNQ.signal]
# stop_atr_multiplier = 1.25

[symbols.MES]
# Same pattern as MNQ (risk / signal / filters).

[symbols.MGC]
# MGC often needs tighter stops than MNQ/MES (``$``/pt). Example:
# [symbols.MGC.risk]
# position_size = 1
# [symbols.MGC.signal]
# stop_atr_multiplier = 1.0

# Nested ``[symbols.<SYM>.filters]`` overrides **numeric / boolean filter keys** from ``[filters]``
# for that symbol only (``overnight_range`` ``check_market_conditions``). Use ``*_pct`` or legacy ``*_pts``.
#
# [symbols.MES.filters]
# range_min_pct = 0.05
# atr_min_pct = 0.03
