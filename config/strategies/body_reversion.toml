# Body-reversion strategy (research-grade, v3).
#
# Discovery report: docs/alpha/deep_scan_INDEX.md
# Combo-trigger audit: docs/alpha/body_reversion_combos.md
#
# Effect-size summary (5m forward-return diff in points, anchor only):
#   body>0.70 → bear→LONG  +5.3 (MNQ) / +1.5 (MES) / +1.2 (MGC)
#   body>0.85 → bear→LONG  +14.7 / +4.5 / +2.4
#   body>0.90 → bear→LONG  +26.6 / +6.9 / +2.6
#   body>0.90 → bull→SHORT -20.1 / -5.4 / -3.0
# All IS/OOS sign-stable on session-date split, BH-FDR significant.
#
# v3 — co-trigger amplification. Adding `atr_high_q4` AND `range_expand_1.5x`
# co-triggers (default ON) multiplies realised R cross-instrument:
#
# Realised R (stop-only / fixed-hold, stop=0.5×ATR, hold=6 bars):
#   anchor only (v2):
#     MNQ bear→LONG  +0.45 PF 1.74 n=2,589
#     MES bear→LONG  +0.37 PF 1.57 n=3,618
#     MGC bear→LONG  +0.16 PF 1.25 n=3,963
#   + atr_high_q4 + range_expand_1.5x (v3 default):
#     MNQ bear→LONG  +1.98 PF 6.15 n=  557
#     MES bear→LONG  +2.73 PF 10.6 n=  699
#     MGC bear→LONG  +1.96 PF 6.52 n=  526
#     MNQ bull→SHORT +0.77 PF 2.99 n=  501
#     MES bull→SHORT +1.66 PF 6.65 n=  604
#     MGC bull→SHORT +2.35 PF 7.75 n=  512
#
# v3 makes bull→SHORT viable: the regime gates isolate event bars where
# reversion dominates trend continuation, fixing the v2 SHORT-leg bleed
# during sustained rallies (especially on MES/MGC).
#
# Live wiring is OFF by default. Backtest (5m pre-resampled CSV is ~10× faster):
#   .venv/bin/python historical_data/resample_ohlcv_csv.py \
#     -i historical_data/price/MNQ_1m_databento_GLBX-20260504-UDPDE7PWXR.csv \
#     --to 5m -o historical_data/price/MNQ_5m_databento.csv
#   ENABLE_SIGNALR=false PYTHONUNBUFFERED=1 \
#     .venv/bin/python core/backtest_executor.py --strategy=body_reversion \
#       --symbol=MNQ --timeframe=5m \
#       --csv=historical_data/price/MNQ_5m_databento.csv \
#       --start=2024-01-01 --end=2026-05-01 --replay --format=json --include-trades \
#       > /tmp/body_rev_MNQ.json 2> /tmp/body_rev_MNQ.log
#
# All knobs honour env overrides (e.g. BODY_REVERSION_SIGNAL_BODY_PCT_MIN=0.85).

[meta]
# Live / PRAC: set false if you only want replay or to avoid auto-select picking this up.
enabled = true
symbols = ["MNQ", "MES", "MGC"]

[risk]
position_size      = 1
max_positions      = 1
max_daily_trades   = 8
risk_per_trade_pct = 0.5
respect_dll        = true
respect_mll        = true
max_dll_usage_pct  = 0.75

[signal]
# 5m default — discovery report uses 5m bars resampled to NY.
timeframe                  = "5m"
# v3: 500 bars (~3 trading days at 5m) so the rolling ATR-percentile gate
# has enough samples to be stable.
lookback_bars              = 500
# Body fraction threshold: |close - open| / (high - low).
# v2 default raised to 0.90 — captures capitulation/squeeze bars where
# mean reversion is sharp; 0.70 caught too many trending bars.
body_pct_min               = 0.90
# v3: SHORT becomes profitable when the regime gates fire (combo audit).
allow_long                 = true
allow_short                = true
# ATR(period) on the same timeframe used for stop distance.
atr_period                 = 14
# Tight stop — 0.5×ATR — research showed it dominates 1.0/1.5/2.0×ATR
# for realised R across all symbols.
stop_atr_multiplier        = 0.5
# Wide TP (3R) so stops + time-based exit dominate; the alpha lives in the
# post-event drift, not in a small TP. Practical exit is the time unwind
# (max_hold_bars) — tp_r_multiple guards against runaway moves.
tp_r_multiple              = 3.0
# Optional “greedier peel” experiments (Q1 / short-window replay first; do not
# ship live without OOS evidence): env overrides —
#   BODY_REVERSION_SIGNAL_TP_R_MULTIPLE=1.5   # bank TP sooner → higher win%, lower avg R
#   BODY_REVERSION_SIGNAL_MIN_BARS_BETWEEN_SIGNALS=4   # more signals (cluster risk)
# Stop-entry offset beyond bar close, in ticks.
entry_offset_ticks         = 1.0
# Cooldown: refuse new signals for N bars after the last one fired
# (avoids stacking entries on consecutive big-body bars).
min_bars_between_signals   = 6
# Time-based exit: close any open position after this many bars if it has
# not hit stop or TP. Discovery showed 3-6 bars is the sweet spot.
max_hold_bars              = 6

# v3 co-trigger gates (see docs/alpha/body_reversion_combos.md).
#
# A/B/C replay (Q1 2026 OOS) showed **symbol-specific** tradeoffs:
# - MNQ + MGC prefer ATR-only (higher cadence, strong Sharpe) — range gate
#   often filters out too much profitable signal.
# - MES prefers BOTH gates; the range expansion gate is critical to prevent
#   short-leg bleed in equity-rally regimes.
#
# The strategy supports per-symbol overrides under `[symbols.<SYM>.signal]`.

# atr_high_q4: require current 14-bar ATR to be in the top quartile of the
# trailing window. Confirms we're in a volatile regime where reversion is sharp.
require_high_atr           = true
atr_regime_lookback        = 500
atr_regime_quantile        = 0.75

# range_expand_1.5x: require current bar range > 1.5 × the trailing N-bar
# range MA. Confirms the bar is significantly larger than recent average,
# i.e. an actual capitulation event rather than a normal big body in a slow
# day.
require_range_expand       = false
# When true **together** with ``require_range_expand`` on a symbol, pass if
# **either** range expansion **or** a Bollinger touch fires (docs/BONGO.md).
require_bb_touch           = false
bb_period                  = 20
bb_k                       = 2.0
range_ma_period            = 20
range_expand_mult          = 1.5

# RTH gating: discovery showed the strongest effect in `eth_overnight`,
# so RTH is OFF by default. Flip on if your account restricts hours.
rth_only                   = false
rth_start                  = "09:35"
rth_end                    = "15:30"
skip_open_minutes          = 30
# BONGO §1C (experiment; do not ship without replay): combo audit suggests skipping
# the first ~5–15 min of RTH lifts WR on kept trades. Safe probe is
#   rth_only = true
#   skip_open_minutes = 5
# (leave defaults above until a symbol replay confirms cadence vs WR trade-off).
session_timezone           = "US/Eastern"

[position_management]
# BONGO §1B: after ``breakeven_trigger_r`` × initial stop distance (price) in your favour,
# move the broker stop toward entry. Replay before enabling live.
breakeven_enabled   = false
breakeven_trigger_r = 0.5

[symbols.MNQ]
[symbols.MES]
[symbols.MGC]

# Per-symbol overrides (v3.1): MES needs the range-expansion gate, MNQ/MGC do not.
[symbols.MES.signal]
require_range_expand = true
# BONGO OR co-trigger: capitulation wick can tag the band without 1.5× range MA.
require_bb_touch = true

[symbols.MGC.signal]
# BONGO: slightly looser ATR gate on gold (replay evidence); validate before live.
atr_regime_quantile = 0.65
