# 15m RSI switch — 5m RSI hook + 15m EMA reaction; exit on 15m RSI opposite extreme.
#
# Replay (5m CSV; 15m EMAs/exit RSI resampled in mock bot):
#   ENABLE_SIGNALR=false .venv/bin/python core/backtest_executor.py \
#     --strategy=rsi_switch_15m --symbol=MNQ --timeframe=5m \
#     --csv=historical_data/price/MNQ_5m_databento.csv \
#     --start=2025-01-01 --end=2026-05-01 --replay --format=json

start_time = "00:00"
end_time = "23:59"
no_trade_start = ""
no_trade_end = ""

[meta]
enabled = false
symbols = ["MNQ", "MES", "MGC"]

[risk]
position_size = 1
max_positions = 1
max_daily_trades = 20
risk_per_trade_pct = 0.5

[signal]
timeframe = "15m"
rsi_timeframe = "5m"
lookback_bars = 500
ema_periods = [8, 21, 50, 100, 200]
rsi_period = 14

# 5m hook; 15m RSI used for exit switch (tournament champion g1_x5_mid_32_68_ema_strict)
rsi_long_max = 32.0
rsi_short_min = 68.0
rsi_hook_buffer = 3.0
rsi_deep_extra = 2.0
rsi_neutral_high = 48.0
rsi_neutral_low = 52.0
rsi_profit_exit_long = 52.0
rsi_profit_exit_short = 48.0

require_confirm_candle = true
require_ema_reaction = true
block_counter_trend = true
reaction_tol_atr = 0.35

atr_period = 14
stop_atr_multiplier = 2.0
tp_r_multiple = 1.25
min_hold_bars = 2
flat_move_atr = 0.08
loss_cut_atr = 0.70
min_bars_between_entries = 4
entry_offset_ticks = 0.0
