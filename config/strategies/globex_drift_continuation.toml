# Globex Drift Continuation (Phase-2 #2.5 — Asian-session breakout).
#
# Alpha thesis (per docs/STRATEGY_ARSENAL.md):
#   During the Globex Asian session (18:00 → 04:00 ET) the market
#   often drifts in the direction set by the late-RTH close.  Capture
#   the Asian breakout in the prior-RTH-close direction using the
#   same Crabel-style stop-entry bracket geometry as NR7.
#
# Direction : TREND-CONTINUE (one direction per Globex session per symbol).
# Window    : Range build 18:00 → 22:00 ET; entry window 22:00 → 04:00 ET;
#             force-flat at 04:00 ET.
# Symbols   : MNQ + MES.
# Stop      : 0.8 × ATR(14) on 5m bars.
# TP        : 1.8R.
# Risk      : 1 contract per fill; consec-loss breaker tripped after 3
#             losses with a 3-day cooldown.  Portfolio daily breaker
#             (Phase-1) consulted via
#             ``core.portfolio_daily_breaker.replay_evaluate``.
#
# Run backtest (offline CSV):
#   ENABLE_SIGNALR=false PYTHONUNBUFFERED=1 \
#     .venv/bin/python core/backtest_executor.py --strategy=globex_drift_continuation \
#       --symbol=MNQ --timeframe=5m \
#       --csv=historical_data/price/MNQ_5m_databento.csv \
#       --start=2025-11-01 --end=2026-05-01 --replay --format=json --include-trades \
#       > /tmp/globex_drift_continuation_MNQ.json 2> /tmp/globex_drift_continuation_MNQ.log
#
# Executor ``should_trade`` window (US/Eastern).  Spans midnight, so we keep
# both halves liberal — the strategy's own entry_window_* keys enforce the
# actual gate.
start_time       = "00:00"
end_time         = "23:59"
no_trade_start   = ""
no_trade_end     = ""

[meta]
# Disabled by default — switch on once the 6m walk-forward acceptance
# criteria (RF ≥ 5, DD ≤ 50 %, ≥ 25 fills, PF ≥ 1.3) clear.
enabled = false
live_breaker_enabled = true
symbols = ["MNQ", "MES"]

[risk]
position_size      = 1
max_positions      = 1
max_daily_trades   = 1
risk_per_trade_pct = 0.5
respect_dll        = true
respect_mll        = true
max_dll_usage_pct  = 0.75

[signal]
timeframe                  = "5m"
# Need ~25 trading days of 5m bars for stable ATR + RTH bias lookup.
lookback_bars              = 2000

# ATR(14) on 5m bars for intraday stop scaling.
atr_period                 = 14
stop_atr_multiplier        = 0.8
tp_r_multiple              = 1.8
entry_offset_ticks         = 1

# Force-flat after this many 5m bars (72 = 6h).  Combined with the
# 04:00 ET flat_et cutoff, ensures no Globex trade survives into the
# European / pre-RTH session.
max_hold_bars              = 72

# Globex session boundaries (ET).
globex_start_et            = "18:00"
range_freeze_et            = "22:00"
entry_window_end_et        = "04:00"
flat_et                    = "04:00"

# RTH window for prior-session bias calc.
rth_start_et               = "09:30"
rth_end_et                 = "16:00"

# Bias quality filter — minimum body / range ratio of the prior RTH
# session to qualify as a non-doji close direction.
min_body_pct               = 0.15

# Consecutive-loss breaker — same shape as NR7 / overnight_range.
max_consecutive_losses     = 3
loss_streak_cooldown_sessions = 3
loss_streak_magnitude_dollars = 0.0

[symbols.MNQ]
[symbols.MES]
