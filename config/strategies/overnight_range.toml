# Overnight Range Breakout strategy configuration.
# See _schema.toml for documentation of every field.
# Edit values here without restarting unrelated strategies; the executor
# polls mtime and reloads on next loop tick when --reload is enabled.
# Master GUI chart OR lines (when the executor is a separate process): see
# process_states.metadata.or_ranges + strategy_states.settings.or_ranges in README / HANDOFF.

[meta]
enabled = true
symbols = ["MNQ", "MES", "MGC"]

[timing]
overnight_start  = "18:00"
overnight_end    = "9:29"
market_open      = "9:29"
zone_anchor      = "9:29"
session_timezone = "US/Eastern"
# Strategy CSV replay only: analyze() runs in this many minutes after market_open (ET).
replay_order_window_minutes = 8

[risk]
position_size      = 1
max_positions      = 2
max_daily_trades   = 4
risk_per_trade_pct = 0.5
respect_dll        = true
respect_mll        = true
max_dll_usage_pct  = 0.75

[signal]
atr_period          = 14
atr_timeframe       = "15m"
stop_atr_multiplier = 1.25
tp_atr_multiplier   = 2.0
use_range_pct_sltp  = false
stop_range_pct      = 50.0
tp_range_pct        = 100.0

[position_management]
breakeven_enabled          = true
# BONGO: tighter BE arm (validate vs slip); was 15.
breakeven_profit_points    = 8.0
range_break_offset         = 0.25
use_dynamic_atr_for_orders = true

[breakout_monitor]
enabled              = true
proximity_pct        = 10.0
min_proximity_points = 5.0
interval_seconds     = 15.0

[alerts]
# Discord when this many consecutive sessions end with zero completed trades (0 = off).
discord_after_zero_trade_sessions = 0

[filters]
# --- Trade frequency note ---
# At most ~1 bracket attempt / symbol / session near open. ``skip_weekdays`` removes listed
# weekdays (Mon=0 … Sun=6). With range+gap+volatility all true, narrow bands still skip many sessions.
#
# **Live (2026-05): Pathway 1 research P5** — same knobs as ``scripts/run_overnight_range_sweep.sh``
# step P5 (filters **on**, widened bands, Mon/Fri included): ``skip_weekdays = []``,
# ``range_min/max`` 30..600, ``gap_max_pts`` 250, ``atr_min/max`` 15..220.
# To revert toward the prior Phase 1.1 preset: ``skip_weekdays = [0, 4]``, range 60..400,
# gap 150, ATR 25..180.
range_size        = true
gap               = true
volatility        = true
dll_proximity     = false
# BONGO: allow slightly narrower overnight boxes (replay / pathway 1 follow-up).
range_min_pts     = 20.0
range_max_pts     = 600.0
gap_max_pts       = 250.0
atr_min           = 15.0
atr_max           = 220.0
dll_threshold_pct = 0.75
# Python weekday: 0=Mon … 6=Sun — empty = trade all weekdays (P5 research).
skip_weekdays     = []

[symbols.MNQ]
[symbols.MES]
[symbols.MGC]
